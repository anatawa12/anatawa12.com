<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — anatawa12.com</title>
  <link rel="icon" href="./icon-circle.svg">
  <style>
    :root {
      --bg: #deeaf2;
      --ink: #1c1b18;
      --muted: #757369;
      --accent: #34524a;
      --sans: "Noto Sans", "Noto Sans JP", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Noto Sans Mono", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      text-align: center;
    }

    main { max-width: 620px; }

    .code {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 14px;
      letter-spacing: .12em;
    }

    h1 {
      margin: 8px 0 16px;
      font-family: var(--mono);
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
    }

    p { margin: 0 0 8px; }

    a {
      display: inline-block;
      margin-top: 24px;
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
